# Cabeceras de seguridad del dashboard SILA (ver docs/CSP.md). Se incluye en CADA location que define sus propias
# cabeceras: en nginx, `add_header` de un bloque reemplaza (no suma) a las del bloque de arriba.
#
# Para estrenar la política sin riesgo, cambia «Content-Security-Policy» por «Content-Security-Policy-Report-Only»
# unos días y vuelve cuando no haya avisos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
