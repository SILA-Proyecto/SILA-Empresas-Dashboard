# Servidor web del dashboard SILA: sirve el build (`npx ng build` → dist/dashboard-app/browser) y reenvía /api al backend.
# Mismo origen para ambos: la cookie de renovación y la comprobación de origen del backend lo exigen.
#
# Instalación (ajusta dominio, certificados y rutas):
#   cp -r dist/dashboard-app/browser/* /var/www/sila/
#   mkdir -p /etc/nginx/sila && cp deploy/cabeceras-seguridad.conf /etc/nginx/sila/
#   cp deploy/nginx.conf /etc/nginx/conf.d/sila.conf && nginx -t && systemctl reload nginx
#
# El backend debe correr con SILA_COOKIE_SECURE=true (HTTPS) y con este dominio como origen permitido.

server {
  listen 80;
  server_name sila.ejemplo.com;                  # TODO: tu dominio
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name sila.ejemplo.com;                  # TODO: tu dominio
  ssl_certificate     /etc/letsencrypt/live/sila.ejemplo.com/fullchain.pem;   # TODO
  ssl_certificate_key /etc/letsencrypt/live/sila.ejemplo.com/privkey.pem;     # TODO

  root /var/www/sila;
  index index.html;
  server_tokens off;
  client_max_body_size 12m;                      # archivos del ADMIN: hasta 10 MB

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Archivos con hash en el nombre: nunca cambian.
  location ~* \.(?:js|css|woff2|svg|ico)$ {
    include /etc/nginx/sila/cabeceras-seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html nunca queda en caché (apunta a los archivos con hash de la versión vigente).
  location = /index.html {
    include /etc/nginx/sila/cabeceras-seguridad.conf;
    add_header Cache-Control "no-store" always;
  }

  # Rutas de la aplicación (SPA).
  location / {
    include /etc/nginx/sila/cabeceras-seguridad.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
